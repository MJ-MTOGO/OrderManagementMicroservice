name: CI/CD Pipeline for OrderService

on:
  push:
    branches:
      - main
      - testbranche

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set Up Google Cloud Credentials for Tests
      - name: Set Up Google Cloud Credentials
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > /tmp/gcloud-key.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-key.json



      # Step 4: Run All Tests
      - name: Run All Tests
        working-directory: ./OrderManagementServiceTests
        run: |
          dotnet restore OrderManagementServiceTests.csproj
          dotnet test OrderManagementServiceTests.csproj --no-build --verbosity normal --logger:"trx;LogFileName=TestResults.trx"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-key.json

      # Step 5: Upload Test Results
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: ./OrderManagementServiceTests/TestResults.trx

      # Step 6: Authenticate with GCP (only on main branch)
      - name: Authenticate with GCP
        if: github.ref_name == 'main'
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Step 7: Install gke-gcloud-auth-plugin (only on main branch)
      - name: Install gke-gcloud-auth-plugin
        if: github.ref_name == 'main'
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      # Step 8: Configure kubectl (only on main branch)
      - name: Configure kubectl
        if: github.ref_name == 'main'
        run: gcloud container clusters get-credentials mtogov1-clusterv2 --region europe-north1-a

      # Step 9: Configure Docker (only on main branch)
      - name: Configure Docker
        if: github.ref_name == 'main'
        run: gcloud auth configure-docker

      # Step 10: Build and Push Docker Image (only on main branch)
      - name: Build and Push Docker Image
        if: github.ref_name == 'main'
        working-directory: ./OrderManagementService
        run: |
          docker build -t gcr.io/mtogov1/order-management-service:latest -f Dockerfile .
          docker push gcr.io/mtogov1/order-management-service:latest

      # Step 11: Deploy to Kubernetes (only on main branch)
      - name: Deploy to Kubernetes
        if: github.ref_name == 'main'
        working-directory: ./kubernetes-configs
        run: |
          kubectl apply -f deployment.yaml --validate=false
          kubectl apply -f service.yaml --validate=false

      # Step 12: Clean Up Credentials
      - name: Clean Up Credentials
        run: rm -f /tmp/gcloud-key.json
